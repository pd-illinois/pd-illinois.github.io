<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pd-illinois | AI Blog</title>
  <meta name="description" content="Public-facing AI experiments, notes, and demos by pd-illinois." />
  <style>
    :root {
      --bg-1: #f7f6f3;
      --bg-2: #efe9dc;
      --ink: #1f1f1f;
      --muted: #5c564d;
      --accent: #c74f2f;
      --card: rgba(255, 255, 255, 0.75);
      --border: rgba(31, 31, 31, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Georgia", "Times New Roman", serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, rgba(199, 79, 47, 0.12), transparent 35%),
        radial-gradient(circle at 85% 30%, rgba(31, 31, 31, 0.08), transparent 40%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }

    .shell {
      width: min(900px, 100%);
      border: 1px solid var(--border);
      background: var(--card);
      backdrop-filter: blur(6px);
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      animation: rise 700ms ease-out;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      align-items: center;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      color: var(--muted);
    }

    .status-dot {
      width: 10px;
      height: 10px;
      display: inline-block;
      border-radius: 50%;
      background: var(--accent);
      margin-right: 0.5rem;
      animation: pulse 1.8s infinite;
    }

    .content {
      padding: clamp(1.5rem, 3vw, 3rem);
      display: grid;
      gap: 1.25rem;
    }

    h1 {
      font-size: clamp(2rem, 4.5vw, 3.4rem);
      line-height: 1.05;
      margin: 0;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0;
      max-width: 65ch;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border: 1px solid var(--ink);
      color: var(--ink);
      text-decoration: none;
      border-radius: 999px;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
      transition: 180ms ease;
    }

    .cta:hover {
      background: var(--ink);
      color: #fff;
      transform: translateY(-1px);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.25rem;
    }

    .chip {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.35rem 0.65rem;
      font-size: 0.82rem;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.7);
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.35; }
      100% { opacity: 1; }
    }

    @media (max-width: 640px) {
      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <div><span class="status-dot" aria-hidden="true"></span>GitHub Pages test build</div>
      <div id="today"></div>
    </div>

    <section class="content">
      <h1>Hello from pd-illinois.github.io</h1>
      <p>
        This is the first public test page for my AI blog and website.
        Next I will add posts, project demos, and practical notes about what I build.
      </p>
      <a class="cta" href="https://github.com/pd-illinois" target="_blank" rel="noreferrer">Visit my GitHub profile</a>

      <div class="chips" aria-label="content themes">
        <span class="chip">AI demos</span>
        <span class="chip">Prompt experiments</span>
        <span class="chip">Dev notes</span>
        <span class="chip">Public projects</span>
      </div>
    </section>
  </main>

  <script>
    const now = new Date();
    document.getElementById("today").textContent = now.toLocaleDateString(undefined, {
      weekday: "short",
      year: "numeric",
      month: "short",
      day: "numeric"
    });
  </script>
</body>
</html>
